name: backport

# Weekly sync from https://github.com/charmbracelet/crush (the
# upstream this repo was forked from): find upstream commits since
# last_backport.commit, pin a reference checkout of upstream at the
# end of that window, and run a single Angela session that triages
# the commits and writes the accepted bug fixes directly onto a
# branch. The PR is the unit of review — nothing here pushes straight
# to main.
#
# Two safety rails keep this from running away:
#   - WINDOW_MAX (the `window_max` input, default 40) caps how many
#     upstream commits a single run will triage. last_backport.commit
#     only advances to the end of the processed window, so a capped
#     run picks up exactly where it left off next time.
#   - If a backport PR from a previous run is still open, this run
#     does nothing (see discover.sh) rather than opening a second one
#     that would fight it for the same last_backport.commit update.
#
# Security constraints (do not relax without re-reading these, same
# reasoning as docs.yml/review.yml):
#   - Angela is built from this repository's own main branch, not from
#     any PR — there is no untrusted source input here. The untrusted
#     input is upstream commit content (subjects, diffs), which is
#     read into the LLM prompt (and browsable via the reference
#     checkout) as DATA with the same injection-defense wording
#     docs.yml/review.yml use, never as instructions.
#   - The provider API key is only pulled from secrets inside the
#     "Write CI Angela config" step, written to a file under
#     $RUNNER_TEMP (never the checked-out repo, never committed).
#   - The config enables edit/write/multiedit so the model can write
#     the backport directly, but denies the agent's own bash tool from
#     running `git commit`, `git push`, or `gh` — every git and GitHub
#     operation is performed by these workflow scripts, never by the
#     model.
#
# Required repository secrets (Settings -> Secrets and variables ->
# Actions -> Secrets). Everything here is read from `secrets.*`, not
# `vars.*`, for the same reason as docs.yml/review.yml.
#   - ANGELA_BACKPORT_API_KEY       (required) API key for the
#     provider or third-party relay used for triage and migration.
#   - ANGELA_BACKPORT_PROVIDER_TYPE (optional) provider type passed to
#     `provider add --type` (openai, openai-compat, anthropic, ...).
#     Defaults to "anthropic".
#   - ANGELA_BACKPORT_BASE_URL      (optional) API base URL. Defaults
#     to the official Anthropic endpoint.
#   - ANGELA_BACKPORT_MODEL         (required) model to use, in
#     `backport/<model-id>` form.
#   - ANGELA_BACKPORT_EXPLORE_MODEL (optional) model for the explore
#     sub-agent, same form. Defaults to ANGELA_BACKPORT_MODEL.
#   - ANGELA_BACKPORT_PR_TOKEN      (optional) a PAT with contents:write
#     and pull-requests:write on this repo. When set, the backport
#     branch is pushed and the PR opened as that user, so the PR
#     triggers this repo's normal build/lint/review workflows the way
#     a human-opened PR does. Without it, the default GITHUB_TOKEN is
#     used — that still works, but GitHub will not run other workflows
#     off a GITHUB_TOKEN-authored PR, so `go build`/`go test` inside
#     this workflow (see the PR body's Verification section) are then
#     the only automated check the PR gets before review.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip push/PR creation; print the branch diff and PR body to the job summary instead.
        type: boolean
        default: true
      since:
        description: Override the commit to diff upstream from (defaults to last_backport.commit).
        type: string
        required: false
      window_max:
        description: Max number of upstream commits to triage in this run.
        type: string
        required: false
        default: "40"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: backport
  cancel-in-progress: false

jobs:
  backport:
    runs-on: ubuntu-latest
    if: github.repository == 'NaturalSelect/angela'
    timeout-minutes: 360
    env:
      BACKPORT_TMP: ${{ runner.temp }}/backport
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || false }}
      PUSH_TOKEN: ${{ secrets.ANGELA_BACKPORT_PR_TOKEN || github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Discover upstream range
        id: discover
        env:
          WINDOW_MAX: ${{ (github.event_name == 'workflow_dispatch' && inputs.window_max) || '40' }}
          SINCE_OVERRIDE: ${{ (github.event_name == 'workflow_dispatch' && inputs.since) || '' }}
          OUT_DIR: ${{ env.BACKPORT_TMP }}
          GH_TOKEN: ${{ env.PUSH_TOKEN }}
        run: |
          mkdir -p "$OUT_DIR"
          scripts/backport/discover.sh

      - name: Build angela
        if: steps.discover.outputs.has_work == 'true'
        run: go build -o "${RUNNER_TEMP}/bin/angela" .

      - name: Install gofumpt
        if: steps.discover.outputs.has_work == 'true'
        run: |
          go install mvdan.cc/gofumpt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Write CI Angela config
        if: steps.discover.outputs.has_work == 'true'
        env:
          PROVIDER_TYPE: ${{ secrets.ANGELA_BACKPORT_PROVIDER_TYPE || 'anthropic' }}
          BASE_URL: ${{ secrets.ANGELA_BACKPORT_BASE_URL || 'https://api.anthropic.com' }}
          BACKPORT_MODEL: ${{ secrets.ANGELA_BACKPORT_MODEL }}
          EXPLORE_MODEL: ${{ secrets.ANGELA_BACKPORT_EXPLORE_MODEL || secrets.ANGELA_BACKPORT_MODEL }}
          ANGELA_BACKPORT_API_KEY: ${{ secrets.ANGELA_BACKPORT_API_KEY }}
        run: |
          export ANGELA_BACKPORT_API_KEY
          if [ -z "$ANGELA_BACKPORT_API_KEY" ]; then
            echo "::error::Repository secret ANGELA_BACKPORT_API_KEY is not set."
            exit 1
          fi
          if [ -z "$BACKPORT_MODEL" ]; then
            echo "::error::Repository secret ANGELA_BACKPORT_MODEL is not set. It must be 'backport/<model-id>', e.g. backport/claude-sonnet-4-5-20250929."
            exit 1
          fi
          MODEL_ID="${BACKPORT_MODEL##*/}"
          EXPLORE_MODEL_ID="${EXPLORE_MODEL##*/}"

          mkdir -p "${BACKPORT_TMP}/angela-config"

          # edit/write/multiedit are enabled so the model can write the
          # backport directly, but git/gh stay denied — every git and
          # GitHub operation belongs to backport.sh, never the model.
          jq -n \
            --arg type "${PROVIDER_TYPE}" \
            --arg base_url "${BASE_URL}" \
            --arg api_key "${ANGELA_BACKPORT_API_KEY}" \
            --arg main_model "${MODEL_ID}" \
            --arg chore_model "${EXPLORE_MODEL_ID}" \
            '
            def mkmodel($id): {
              id: $id,
              can_reason: true,
              reasoning_levels: ["low", "medium", "high", "max"]
            };
            {
              providers: {
                backport: {
                  type: $type,
                  base_url: $base_url,
                  api_key: $api_key,
                  discover_models: false,
                  models: (
                    if $chore_model == $main_model
                    then [mkmodel($main_model)]
                    else [mkmodel($main_model), mkmodel($chore_model)]
                    end
                  )
                }
              },
              models: {
                main:  { provider: "backport", model: $main_model },
                chore: { provider: "backport", model: $chore_model }
              },
              agents: {
                explore: { model: "chore" },
                general: { disabled: true }
              },
              permissions: {
                allowed_tools: ["bash", "view", "ls", "grep", "glob", "edit", "write", "multiedit", "agent"],
                rules: [
                  { action: "deny", tool: "bash", pattern: "*git commit*" },
                  { action: "deny", tool: "bash", pattern: "*git push*" },
                  { action: "deny", tool: "bash", pattern: "*gh *" }
                ]
              },
              options: {
                disabled_tools: [
                  "lsp_rename", "lsp_replace_symbol",
                  "fetch", "download", "web_fetch", "web_search", "sourcegraph",
                  "question"
                ],
                auto_lsp: false,
                disable_metrics: true,
                progress: false
              }
            }
            ' > "${BACKPORT_TMP}/angela-config/angela.json"

      - name: Compute backport branch name
        id: branch
        if: steps.discover.outputs.has_work == 'true'
        env:
          WINDOW_END: ${{ steps.discover.outputs.window_end }}
        run: |
          short="${WINDOW_END:0:8}"
          echo "name=backport/upstream-$(date -u +%Y%m%d)-${short}" >> "$GITHUB_OUTPUT"

      - name: Create backport branch
        if: steps.discover.outputs.has_work == 'true'
        run: git checkout -b "${{ steps.branch.outputs.name }}"

      - name: Backport upstream commits
        if: steps.discover.outputs.has_work == 'true'
        timeout-minutes: 120
        env:
          OUT_DIR: ${{ env.BACKPORT_TMP }}
          ANGELA_BIN: ${{ runner.temp }}/bin/angela
          ANGELA_GLOBAL_CONFIG: ${{ env.BACKPORT_TMP }}/angela-config
          ANGELA_GLOBAL_DATA: ${{ env.BACKPORT_TMP }}/angela-global-data
          MIGRATE_MODEL: ${{ secrets.ANGELA_BACKPORT_MODEL }}
          WINDOW_END: ${{ steps.discover.outputs.window_end }}
          WORKDIR: ${{ github.workspace }}
        run: scripts/backport/backport.sh

      - name: Run full test suite
        id: fulltest
        if: steps.discover.outputs.has_work == 'true'
        continue-on-error: true
        run: go test ./... > "${BACKPORT_TMP}/full-test.log" 2>&1

      - name: Open backport PR
        if: steps.discover.outputs.has_work == 'true'
        env:
          OUT_DIR: ${{ env.BACKPORT_TMP }}
          WINDOW_END: ${{ steps.discover.outputs.window_end }}
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          DRY_RUN: ${{ env.DRY_RUN }}
          TEST_OUTCOME: ${{ steps.fulltest.outcome }}
          TEST_LOG: ${{ env.BACKPORT_TMP }}/full-test.log
          GH_TOKEN: ${{ env.PUSH_TOKEN }}
        run: scripts/backport/open_pr.sh

      - name: Job summary
        if: always()
        env:
          HAS_WORK: ${{ steps.discover.outputs.has_work }}
          SKIP_REASON: ${{ steps.discover.outputs.skip_reason }}
        run: |
          if [ "$HAS_WORK" != "true" ]; then
            {
              echo "## Backport: nothing to do"
              echo
              case "$SKIP_REASON" in
                no_new_commits) echo "No new upstream commits since the last backport pointer." ;;
                pr_open) echo "A previous backport PR is still open; skipping until it merges or closes." ;;
                *) echo "Skipped (reason: ${SKIP_REASON:-unknown})." ;;
              esac
            } >> "$GITHUB_STEP_SUMMARY"
          fi
