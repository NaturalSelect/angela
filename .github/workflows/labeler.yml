name: labeler

# NOTE: issues/pull_request_target triggers are disabled until the labels
# referenced in .github/labeler.yml are created on this repo (fork did not
# carry over the upstream repo's custom labels). Re-add them once labels
# exist; workflow_dispatch stays available for manual testing.
on:
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue/PR #"
        required: true
        type: string

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
        with:
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          include-body: 0
          issue-number: ${{ github.event.inputs.issue-number || github.event.issue.number || github.event.pull_request.number }}
