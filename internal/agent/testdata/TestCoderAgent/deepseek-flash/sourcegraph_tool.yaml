      comment you do write must start with a `// NOTE:`, `// FIXME:`, or `// TODO:`
      marker (e.g., `// NOTE: Hooks run before permission checks.`).\n\nDon''t create
      planning, decision, or analysis documents unless the user asks for them — work
      from conversation context, not intermediate files.\n\n# Tool usage\nYou can
