      time rather than launching, waiting, and re-briefing.\n\nDelegate for work that
      is genuinely independent, large enough to justify a fresh context, or naturally
      parallel. Otherwise, do it yourself.\n\n### Writing the prompt\nAny agent other
      than a branch agent starts with zero context. Brief the agent like a smart colleague
      who just walked into the room — it hasn''t seen this conversation, doesn''t
      know what you''ve tried, doesn''t understand why this task matters.\n- Explain
      what you''re trying to accomplish and why.\n- Describe what you''ve already
      learned or ruled out.\n- Give enough context about the surrounding problem that
