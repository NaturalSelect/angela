      blast radius before refactoring → `LSPCallHierarchy`.\n\nFall back to `Edit`/`MultiEdit`
      for non-symbol changes (comments, config, string literals), files without LSP
      support, or surgical within-line edits.\n\n## Delegating to subagents\nUse the
      `Agent` tool with specialized agents when the task at hand matches the agent''s
      description. Subagents are valuable for parallelizing independent queries or
