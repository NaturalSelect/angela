      subagents are for genuinely independent, sizeable tracks (unrelated modules,
      a wide multi-file investigation), not for splitting one modest job into pieces.\n-
      Do not spawn a subagent to review, re-verify, or double-check work you can verify
      inline. Verification that fits in your own loop belongs in your own loop.\n-
      If you delegate, commit to the delegation: do not redo the subagent''s work
      while waiting, and do not re-derive its findings once it reports. If you find
