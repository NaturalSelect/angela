    body: '{"data":{"search":{"results":{"matchCount":30,"limitHit":true,"resultCount":30,"approximateResultCount":"30+","missing":[],"timedout":[],"indexUnavailable":false,"results":[{"__typename":"FileMatch","repository":{"name":"github.com/azrtydxb/procoder"},"file":{"path":"internal/runcmd/runcmd.go","url":"/r/github.com/azrtydxb/procoder/-/blob/internal/runcmd/runcmd.go","content":"//
      Package runcmd answers \"how do I start this project?\" with evidence\n// instead
      of a guess. It reads what the repository itself declared —\n// package.json
      scripts, Makefile targets, main packages, Cargo.toml,\n// Python entry points,
      docker-compose.yml, a Procfile — and PRINTS every\n// launch command it found
      together with the file and line that declared\n// it, most specific first. Nothing
      is invented: a candidate without a\n// file and a line to point at is not a
      candidate.\n//\n// The default path writes nothing and executes nothing (P-CONTROL).\n//
      --exec is the operator''s explicit opt-in, and it runs only when there is\n//
      exactly one candidate AND that candidate is not a long-running server:\n// a
      server''s lifetime belongs to the agent''s own shell, where log capture\n//
      belongs, never to procoder.\npackage runcmd\n\nimport (\n\t\"bytes\"\n\t\"context\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n\t\"os/exec\"\n\t\"path/filepath\"\n\t\"sort\"\n\t\"strings\"\n\t\"time\"\n)\n\n//
      execTimeout bounds --exec. On expiry the command is killed and the\n// answer
      is NOT run — never a pass.\nconst execTimeout = 120 * time.Second\n\n// Candidate
      is one launch command the repository declared, with the\n// evidence that declared
      it. Source is always repo-relative with forward\n// slashes, on every platform.\ntype
      Candidate struct {\n\tCommand     string\n\tSource      string\n\tLine        int\n\tLongRunning
      bool\n\t// Note carries the rest of the evidence when the source file alone
      does\n\t// not name it — \"main package cmd/procoder\" for a go.mod candidate.\n\tNote
      string\n\t// rank orders the listing: lower is more specific. Unexported because\n\t//
      the ranking rules are this package''s business, not its callers''.\n\trank int\n\t//
      root is the directory --exec runs the command in — the repository\n\t// that
      declared it, never the process''s own working directory.\n\troot string\n}\n\n//
      Ranks: lower wins. An explicit `run` target beats a package.json script,\n//
      dev beats start beats serve, and the language-level fallbacks (go run,\n// cargo
      run) come after anything the repository named on purpose.\nconst (\n\trankMakeRun     =
      10\n\trankPkgDev      = 20\n\trankMakeDev     = 21\n\trankPkgStart    = 30\n\trankMakeStart   =
      31\n\trankPkgServe    = 40\n\trankProcWeb     = 50\n\trankProcOther   = 51\n\trankManagePy    =
      60\n\trankPyScript    = 61\n\trankPyMain      = 62\n\trankCargo       = 70\n\trankGoMain      =
      80\n\trankDockerCompo = 90\n)\n\n// serverVerbs are the words that mark a command
      as long-running. A command\n// naming one of these is printed and refused by
      --exec: procoder does no\n// process management of any kind.\nvar serverVerbs
      = map[string]bool{\n\t\"serve\": true, \"server\": true, \"runserver\": true,
      \"dev\": true,\n\t\"start\": true, \"up\": true, \"watch\": true,\n}\n\n// Run
      detects, prints, and — under exec — runs. Exit codes: 0 when\n// candidates
      were printed or none exist, 0 when --exec succeeded, 1 when\n// --exec ran and
      the command failed or timed out, 2 when --exec was\n// refused (several candidates,
      or a long-running server).\nfunc Run(root string, exec bool, out func(string))
      int {\n\tcands, notes := detect(root)\n\t// Unreadable sources are stated out
      loud before the listing: a source\n\t// procoder could not parse is never silently
      skipped.\n\tfor _, n := range notes {\n\t\tout(n)\n\t}\n\treturn Report(cands,
      exec, out)\n}\n\nfunc detect(root string) ([]Candidate, []string) {\n\tvar cands
      []Candidate\n\tvar notes []string\n\tfor _, src := range []func(string) ([]Candidate,
      []string){\n\t\tdetectPackageJSON, detectMakefile, detectProcfile,\n\t\tdetectPython,
      detectCargo, detectGo, detectCompose,\n\t} {\n\t\tc, n := src(root)\n\t\tcands
      = append(cands, c...)\n\t\tnotes = append(notes, n...)\n\t}\n\t// Stable: within
      one rank, the order the file declared them wins.\n\tsort.SliceStable(cands,
      func(i, j int) bool { return cands[i].rank \u003c cands[j].rank })\n\treturn
      cands, notes\n}\n\n// Report prints the candidates and returns the command''s
      exit code. It is\n// the whole of the default path: print, do not run.\nfunc
      Report(cands []Candidate, execute bool, out func(string)) int {\n\tif len(cands)
      == 0 {\n\t\tout(\"no launch command is declared in this repository — nothing
      to run (a library has nothing to launch, and that is not a failure)\")\n\t\treturn
      0\n\t}\n\tlongRunning := false\n\tfor _, c := range cands {\n\t\tout(render(c))\n\t\tif
      c.LongRunning {\n\t\t\tlongRunning = true\n\t\t}\n\t}\n\tif longRunning {\n\t\tout(\"long-running
      commands are marked: start those in your OWN background shell, where log capture
      and the process''s lifetime belong\")\n\t}\n\tif !execute {\n\t\treturn 0\n\t}\n\tif
      len(cands) \u003e 1 {\n\t\tout(fmt.Sprintf(\"--exec refused — %d candidates
      were detected and choosing one would be the guess this command exists to avoid;
      run the one you want yourself\", len(cands)))\n\t\treturn 2\n\t}\n\tc := cands[0]\n\tif
      c.LongRunning {\n\t\tout(\"--exec refused — \" + c.Command + \" is long-running;
      procoder does no process management, so start it in your own background shell\")\n\t\treturn
      2\n\t}\n\treturn execOne(c, out)\n}\n\n// render is one listing line: the command,
      then its evidence as\n// source:line with forward slashes.\nfunc render(c Candidate)
      string {\n\tev := fmt.Sprintf(\"%s:%d\", filepath.ToSlash(c.Source), c.Line)\n\tif
      c.Note != \"\" {\n\t\tev += \", \" + c.Note\n\t}\n\tline := fmt.Sprintf(\"%-40s
      (%s)\", c.Command, ev)\n\tif c.LongRunning {\n\t\tline += \"  [long-running]\"\n\t}\n\treturn
      line\n}\n\n// execOne runs a single one-shot candidate. stdin is /dev/null on
      purpose:\n// a command that wants input fails fast instead of hanging to the
      timeout.\nfunc execOne(c Candidate, out func(string)) int {\n\targv := splitArgs(c.Command)\n\tif
      len(argv) == 0 {\n\t\tout(\"--exec refused — the declared command is empty\")\n\t\treturn
      2\n\t}\n\tbin, err := exec.LookPath(argv[0])\n\t// Say which binary this actually
      resolved to, before running it.\n\t//\n\t// The command comes from the repository;
      the binary comes from PATH.\n\t// The same declared `npm start` is a different
      program depending on\n\t// which npm is first on the path, and somebody approving
      --exec could\n\t// not see which one they were approving. Naming it is the difference\n\t//
      between consenting to a command and consenting to a string (#200).\n\tif err
      == nil {\n\t\tout(\"--exec resolving \" + argv[0] + \" -\u003e \" + bin)\n\t}\n\tif
      err != nil {\n\t\tout(\"--exec FAILED — \" + argv[0] + \" is not installed;
      the command and its evidence are printed above, so run it once you have it\")\n\t\treturn
      1\n\t}\n\tctx, cancel := context.WithTimeout(context.Background(), execTimeout)\n\tdefer
      cancel()\n\tcmd := exec.CommandContext(ctx, bin, argv[1:]...) // nosemgrep --
      the argv comes from the repository''s own declaration, run only on explicit
      --exec\n\tcmd.Dir = c.root\n\tcmd.Stdin = nil // /dev/null: an interactive command
      fails fast\n\tvar buf bytes.Buffer\n\tcmd.Stdout, cmd.Stderr = \u0026buf, \u0026buf\n\trunErr
      := cmd.Run()\n\tfor _, l := range strings.Split(strings.TrimRight(buf.String(),
      \"\\n\"), \"\\n\") {\n\t\tif l != \"\" {\n\t\t\tout(l)\n\t\t}\n\t}\n\tif ctx.Err()
      == context.DeadlineExceeded {\n\t\tout(\"NOT run — \" + c.Command + \" gave
      no answer in \" + execTimeout.String() + \" and was killed; a hung command is
      never a pass\")\n\t\treturn 1\n\t}\n\tif runErr != nil {\n\t\tout(\"--exec FAILED
      — \" + c.Command + \" exited \" + fmt.Sprint(exitCode(runErr)))\n\t\treturn
      1\n\t}\n\tout(\"--exec ok — \" + c.Command)\n\treturn 0\n}\n\nfunc exitCode(err
      error) int {\n\tif e, ok := err.(*exec.ExitError); ok {\n\t\treturn e.ExitCode()\n\t}\n\treturn
      -1\n}\n\n// splitArgs splits a declared command into argv. There is no shell
      here:\n// quoted runs stay one element, and nothing is expanded or interpreted.\nfunc
      splitArgs(s string) []string {\n\tvar out []string\n\tvar cur strings.Builder\n\tquote
      := rune(0)\n\tstarted := false\n\tfor _, r := range s {\n\t\tswitch {\n\t\tcase
      quote != 0:\n\t\t\tif r == quote {\n\t\t\t\tquote = 0\n\t\t\t} else {\n\t\t\t\tcur.WriteRune(r)\n\t\t\t}\n\t\tcase
      r == ''\\'''' || r == ''\"'':\n\t\t\tquote, started = r, true\n\t\tcase r ==
      '' '' || r == ''\\t'':\n\t\t\tif started {\n\t\t\t\tout = append(out, cur.String())\n\t\t\t\tcur.Reset()\n\t\t\t\tstarted
      = false\n\t\t\t}\n\t\tdefault:\n\t\t\tcur.WriteRune(r)\n\t\t\tstarted = true\n\t\t}\n\t}\n\tif
      started {\n\t\tout = append(out, cur.String())\n\t}\n\treturn out\n}\n\n// longRunning
