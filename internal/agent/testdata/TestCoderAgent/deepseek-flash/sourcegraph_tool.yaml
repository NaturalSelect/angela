      If you need a short response, say so (\"report in under 200 words\").\n- Lookups:
      hand over the exact command. Investigations: hand over the question — prescribed
      steps become dead weight when the premise is wrong.\n\nFor fresh agents, terse
      command-style prompts produce shallow, generic work.\n\nA branch agent is the
      opposite case: forking copies the whole conversation behind it, so it already
