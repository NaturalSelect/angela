","role":"tool"}],"model":"deepseek-flash","max_tokens":10000,"stream_options":{"include_usage":true},"tool_choice":"auto","tools":[{"function":{"name":"Bash","strict":false,"description":"Executes a given bash command and returns its output. Long-running commands automatically move to background and return a shell ID.\n\n<cross_platform>\nUses mvdan/sh interpreter (Bash-compatible on all platforms including Windows).\nUse forward slashes for paths: \"ls C:/foo/bar\" not \"ls C:\\foo\\bar\".\nCommon shell builtins and core utils available on Windows.\n</cross_platform>\n\n<execution_steps>\n1. Directory Verification: If your command will create new directories or files, first use the LS tool to verify the parent directory exists and is the correct location\n2. Security Check: Banned commands (alias, aria2c, axel, chrome, curlie, firefox, http-prompt, httpie, links, lynx, nc, safari, scp, ssh, telnet, w3m, wget, xh, doas, su, sudo, apk, apt, apt-cache, apt-get, dnf, dpkg, emerge, home-manager, makepkg, opkg, pacman, paru, pkg, pkg_add, pkg_delete, portage, rpm, yay, yum, zypper, at, batch, chkconfig, crontab, fdisk, mkfs, mount, parted, service, systemctl, umount, firewall-cmd, ifconfig, ip, iptables, netstat, pfctl, route, ufw) return error - explain to user. Safe read-only commands execute without prompts\n3. Command Execution: Execute with proper quoting, capture output\n4. Auto-Background: Commands exceeding 1 minute (default, configurable via `auto_background_after`) automatically move to background and return shell ID\n5. Output Processing: Truncate if exceeds 30000 characters\n6. Return Result: Include errors, metadata with <cwd></cwd> tags\n</execution_steps>\n\n<usage_notes>\n- Command required, working_dir optional (defaults to current directory)\n- Always quote file paths that contain spaces with double quotes (e.g., `cd \"path with spaces/file.txt\"`)\n- Try to maintain your current working directory throughout the session by using absolute paths and avoiding usage of `cd`. You may use `cd` if the user explicitly requests it. In particular, never prepend `cd <current-directory>` to a `git` command — `git` already operates on the current working tree, and the compound triggers a permission prompt\n- Each command runs in an independent shell; the working directory persists between commands but shell state does not\n- Chain with '';'' or ''&&'', avoid newlines except in quoted strings\n- IMPORTANT: Avoid using this tool to run `find`, `grep`, `cat`, `head`, `tail`, `ls`, `sed`, `awk` and similar commands, unless explicitly instructed or after you have verified that a dedicated tool cannot accomplish your task. Use the appropriate dedicated tool instead — it provides a much better experience for the user and makes tool calls easier to review and approve:\n  - File search: Use Glob (NOT find or ls)\n  - Content search: Use Grep (NOT grep or rg)\n  - Read files: Use Read (NOT cat/head/tail)\n  - Edit files: Use Edit or MultiEdit (NOT sed/awk)\n  - Write files: Use Write (NOT echo >/cat <<EOF)\n  - Communication: Output text directly (NOT echo/printf)\n</usage_notes>\n\n<description_parameter>\nClear, concise description of what this command does in active voice. Never use words like \"complex\" or \"risk\" in the description - just describe what it does.\n\nFor simple commands (git, npm, standard CLI tools), keep it brief:\n- ls → \"List files in current directory\"\n- git status → \"Show working tree status\"\n- npm install → \"Install package dependencies\"\n\nFor commands that are harder to parse at a glance (piped commands, obscure flags, etc.), add enough context to clarify what it does:\n- find . -name \"*.tmp\" -exec rm {} \\; → \"Find and delete all .tmp files recursively\"\n- git reset --hard origin/main → \"Discard all local changes and match remote main\"\n</description_parameter>\n\n<sleep>\n- Do not sleep between commands that can run immediately — just run them.\n- If you must poll an external process, use a check command (e.g. `gh run view`) rather than sleeping first.\n- If you must sleep, keep the duration short to avoid blocking the user.\n- If waiting for a background task you started with `run_in_background`, use JobOutput to read it when you need it — do not poll in a sleep loop.\n- Do not retry failing commands in a sleep loop — diagnose the root cause.\n</sleep>\n\n<background_execution>\n- Set run_in_background=true to run commands in a separate background shell\n- Returns a shell ID for managing the background process\n- Use JobOutput tool to view current output from background shell\n- Use JobKill tool to terminate a background shell\n- IMPORTANT: NEVER use `&` at the end of commands to run in background - use run_in_background parameter instead\n- Commands that should run in background:\n  * Long-running servers (e.g., `npm start`, `python -m http.server`, `node server.js`)\n  * Watch/monitoring tasks (e.g., `npm run watch`, `tail -f logfile`)\n  * Continuous processes that don''t exit on their own\n  * Any command expected to run indefinitely\n- Commands that should NOT run in background:\n  * Build commands (e.g., `npm run build`, `go build`)\n  * Test suites (e.g., `npm test`, `pytest`)\n  * Git operations\n  * File operations\n  * Short-lived scripts\n</background_execution>\n\n<git_safety>\n- NEVER update the git config\n- NEVER run destructive git commands (push --force, reset --hard, checkout ., restore ., clean -f, branch -D) unless the user explicitly requests these actions. Taking unauthorized destructive actions is unhelpful and can result in lost work, so it''s best to ONLY run these commands when given direct instructions\n- Before running any destructive operation, consider whether there is a safer alternative that achieves the same goal. Only use destructive operations when they are truly the best approach\n- NEVER skip hooks (--no-verify, --no-gpg-sign, etc) unless the user explicitly requests it. If a hook fails, investigate and fix the underlying issue\n- NEVER run force push to main/master, warn the user if they request it\n- CRITICAL: Always create NEW commits rather than amending, unless the user explicitly requests a git amend. When a pre-commit hook fails, the commit did NOT happen — so --amend would modify the PREVIOUS commit, which may result in destroying work or losing previous changes. Instead, after hook failure, fix the issue, re-stage, and create a NEW commit\n- When staging files, prefer adding specific files by name rather than using \"git add -A\" or \"git add .\", which can accidentally include sensitive files (.env, credentials) or large binaries\n- NEVER commit changes unless the user explicitly asks you to. It is VERY IMPORTANT to only commit when explicitly asked, otherwise the user will feel that you are being too proactive\n- IMPORTANT: Never use git commands with the -i flag (like git rebase -i or git add -i) since they require interactive input which is not supported\n- IMPORTANT: Do not use --no-edit with git rebase commands, as the --no-edit flag is not a valid option for git rebase\n</git_safety>\n\n<git_message_quality>\nThese rules apply whenever creating or updating commit messages, PR titles, or PR bodies:\n\n- Messages MUST be understandable to someone unfamiliar with the codebase.\n- Before creating or updating a message, verify this litmus test: a new contributor reading only the commit message or PR title/body should understand what problem this solves, why it matters, and the impact without opening files, reading the diff, or knowing internal code names.\n- Avoid code identifiers, filenames, function names, and implementation details unless they are necessary for understanding the user-facing impact.\n- Bad: \"Add NameFromHex with sync.Once lazy init\"\n- Good: \"Improve color name lookup performance while keeping startup fast\"\n</git_message_quality>\n\n<commit_messages>\nCommit messages are for future readers scanning history. Before committing:\n\n- Follow <git_message_quality>.\n- Draft a concise 1-2 sentence message focusing on why the change exists and what outcome it enables, not a list of files or implementation details.\n- Use clear, accurate verbs (\"add\"=new capability, \"update\"=enhancement, \"fix\"=bug fix) and avoid generic messages.\n- The first line MUST be under 72 characters.\n- Add a body only when it is needed to explain the reasoning, tradeoffs, or important context; wrap body lines at 72 characters.\n- If the change is internal-only, still describe the benefit or maintenance outcome rather than naming private code.\n- Bad: \"fix: nil pointer in session.go\"\n- Good: \"fix: prevent session loading from crashing on missing metadata\"\n- Bad: \"refactor: move PromptBuilder into internal/agent\"\n- Good: \"refactor: make prompt assembly easier to maintain\"\n</commit_messages>\n\n<git_commits>\nOnly create commits when requested by the user. If unclear, ask first. When the user asks you to create a new git commit, follow these steps carefully.\n\nYou can call multiple tools in a single response. When multiple independent pieces of information are requested and all commands are likely to succeed, run multiple tool calls in parallel for optimal performance. The numbered steps below indicate which commands should be batched in parallel.\n\nFollow <git_safety> throughout.\n\n1. Run the following bash commands in parallel:\n   - Run a git status command to see all untracked files. IMPORTANT: Never use the -uall flag as it can cause memory issues on large repos.\n   - Run a git diff command to see both staged and unstaged changes that will be committed.\n   - Run a git log command to see recent commit messages, so that you can follow this repository''s commit message style.\n\n2. Analyze all staged changes (both previously staged and newly added) and draft a commit message:\n   - Summarize the nature of the changes (eg. new feature, enhancement to an existing feature, bug fix, refactoring, test, docs, etc.). Ensure the message accurately reflects the changes and their purpose.\n   - Do not commit files that likely contain secrets (.env, credentials.json, etc). Warn the user if they specifically request to commit those files.\n   - Draft the message following <commit_messages>, and review the draft against the litmus test in <git_message_quality> before committing.\n   - Do not run additional commands to read or explore code beyond git commands.\n\n3. Run the following commands in parallel:\n   - Add relevant untracked files to the staging area. Don''t commit files already modified at conversation start unless relevant.\n   - Create the commit with attribution. In order to ensure good formatting, ALWAYS pass the commit message via a HEREDOC:\n     git commit -m \"$(cat <<''EOF''\nCommit message here.\n\nGenerated with Angela\n\nCo-Authored-By: Angela:deepseek-flash\nEOF\n)\"\n   - Run git status after the commit completes to verify success. Note: git status depends on the commit completing, so run it sequentially after the commit.\n\n4. If the commit fails due to a pre-commit hook, the commit did NOT happen. Fix the issue, re-stage, and create a NEW commit — never `--amend`.\n\nNotes: If there are no changes to commit (no untracked files and no modifications), do not create an empty commit. Do not push to the remote repository unless the user explicitly asks you to. Do not use the todos or agent tools while committing.\n</git_commits>\n\n<pull_requests>\n\n\nIMPORTANT: When the user asks you to create a pull request, follow these steps carefully:\n\n1. Run the following bash commands in parallel, in order to understand the current state of the branch since it diverged from the main branch:\n   - Run a git status command to see all untracked files (never use -uall flag)\n   - Run a git diff command to see both staged and unstaged changes that will be committed\n   - Check if the current branch tracks a remote branch and is up to date with the remote, so you know if you need to push to the remote\n   - Run a git log command and `git diff [base-branch]...HEAD` to understand the full commit history for the current branch (from the time it diverged from the base branch)\n\n2. Analyze all changes that will be included in the pull request, making sure to look at all relevant commits (NOT just the latest commit, but ALL commits that will be included in the pull request!!!), and draft a pull request title and summary:\n   - Follow <git_message_quality>\n   - Keep the PR title short (under 70 characters)\n   - Use the description/body for details, not the title\n   - Ensure the summary reflects ALL changes since the base branch diverged\n   - Do not run commands beyond git context, and check for sensitive information\n\n3. Run the following commands in parallel:\n   - Create new branch if needed\n   - Push to remote with -u flag if needed\n   - Create PR using `gh pr create` with the format below. Use a HEREDOC to pass the body to ensure correct formatting:\n     gh pr create --title \"the pr title\" --body \"$(cat <<''EOF''\n## Summary\n<1-3 bullet points>\n\n## Test plan\n<checklist of TODOs for verifying the pull request>\n\nGenerated with Angela\nEOF\n)\"\n\nImportant:\n- Do not use the todos or agent tools while creating a PR\n- Never update git config\n- Return the PR URL when you''re done, so the user can see it\n\nOther common operations:\n- View comments on a GitHub PR: gh api repos/foo/bar/pulls/123/comments\n</pull_requests>\n\n<examples>\nGood: pytest /foo/bar/tests\nBad: cd /foo/bar && pytest tests\n</examples>\n","parameters":{"properties":{"auto_background_after":{"description":"Seconds to wait before automatically moving the command to a background job (default: 60)","type":"integer"},"command":{"description":"The command to execute","type":"string"},"description":{"description":"A brief description of what the command does, try to keep it under 30 characters or so","type":"string"},"run_in_background":{"description":"Set to true (boolean) to run this command in the background. Use job_output to read the output later.","type":"boolean"},"working_dir":{"description":"The working directory to execute the command in (defaults to current directory)","type":"string"}},"required":["description","command"],"type":"object"}},"type":"function"},{"function":{"name":"Download","strict":false,"description":"Download a URL directly to a local file (binary-safe, streaming, max 600s timeout); overwrites without warning. For reading content into context use fetch.\n","parameters":{"properties":{"file_path":{"description":"The local file path where the downloaded content should be saved","type":"string"},"timeout":{"description":"Optional timeout in seconds (max 600)","type":"integer"},"url":{"description":"The URL to download from","type":"string"}},"required":["url","file_path"],"type":"object"}},"type":"function"},{"function":{"name":"Edit","strict":false,"description":"Performs exact string replacement in a file; can also create or delete content.\n\n- You must read the file in this conversation before editing it, or the call will fail.\n- `old_string` must match the file exactly, including indentation, and be unique — the edit fails otherwise. Strip the line-number prefix (right-aligned line number then `|`, e.g. `    12|`) before matching.\n- Keep `old_string` minimal — usually 1-3 lines, only enough to be unique in the file. Including excess context wastes tokens and is an error. If it is not unique, add the minimum extra context needed, or use `replace_all` to change every instance.\n- `replace_all: true` replaces every occurrence instead; useful for renaming a variable across the file.\n- If old_string differs from the file only in whitespace, the matching lines are still edited and new_string is re-indented to the file''s style; the response says when this happened, so verify the result.\n- For whole-function/method/type replacements prefer `LSPReplaceSymbol` (no whitespace matching needed). For renames prefer `LSPRename` (semantic, cross-file). For large edits use Write.\n- Only use emojis if the user explicitly requests it. Avoid adding emojis to files unless asked.\n","parameters":{"properties":{"file_path":{"description":"The absolute path to the file to modify","type":"string"},"new_string":{"description":"The text to replace it with","type":"string"},"old_string":{"description":"The text to replace","type":"string"},"replace_all":{"description":"Replace all occurrences of old_string (default false)","type":"boolean"}},"required":["file_path","old_string","new_string"],"type":"object"}},"type":"function"},{"function":{"name":"MultiEdit","strict":false,"description":"Apply multiple find-and-replace edits to a single file in one operation; edits run sequentially. Prefer over edit for multiple changes to the same file.\n\nSame rules as edit apply: read the file first, each old_string must match exactly and be unique at the time its edit runs, and each should stay minimal — usually 1-3 lines.\n","parameters":{"properties":{"edits":{"description":"Array of edit operations to perform sequentially on the file","items":{"properties":{"new_string":{"description":"The text to replace it with","type":"string"},"old_string":{"description":"The text to replace","type":"string"},"replace_all":{"description":"Replace all occurrences of old_string (default false).","type":"boolean"}},"required":["old_string","new_string"],"type":"object"},"type":"array"},"file_path":{"description":"The absolute path to the file to modify","type":"string"}},"required":["file_path","edits"],"type":"object"}},"type":"function"},{"function":{"name":"Fetch","strict":false,"description":"Fetch raw content from a URL as text, markdown, or html (max 100KB); no AI processing. For analysis, extraction, or summarization, dispatch the agent tool with subagent_type \"web-fetch\" instead.\n","parameters":{"properties":{"format":{"description":"The format to return the content in (text, markdown, or html)","type":"string"},"timeout":{"description":"Optional timeout in seconds (max 120)","type":"integer"},"url":{"description":"The URL to fetch content from","type":"string"}},"required":["url","format"],"type":"object"}},"type":"function"},{"function":{"name":"Glob","strict":false,"description":"Fast file pattern matching tool that works with any codebase size.\n\n- Supports glob patterns like \"**/*.js\" or \"src/**/*.ts\".\n- Returns matching file paths sorted by modification time; max 100 results; skips hidden files.\n- Use this tool when you need to find files by name patterns. Use grep to search file contents.\n","parameters":{"properties":{"path":{"description":"The directory to search in. Defaults to the current working directory.","type":"string"},"pattern":{"description":"The glob pattern to match files against","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"Grep","strict":false,"description":"A powerful search tool built on ripgrep.\n\n- ALWAYS use this tool for content search. NEVER invoke `grep` or `rg` as a Bash command; this tool is optimized for correct permissions and access.\n- Supports full regex syntax (e.g., \"log.*Error\", \"function\\s+\\w+\"), or literal text.\n- Pattern syntax uses ripgrep, not grep: literal braces need escaping (use `interface\\{\\}` to find `interface{}` in Go code).\n- Patterns match within single lines by default. For cross-line patterns like `struct \\{[\\s\\S]*?field`, enable multiline matching.\n- Returns matching file paths sorted by modification time (max 100); respects .gitignore.\n- Use Glob to filter by filename, not contents. Use the Agent tool for open-ended searches requiring multiple rounds.\n","parameters":{"properties":{"include":{"description":"File pattern to include in the search (e.g. \"*.js\", \"*.{ts,tsx}\")","type":"string"},"literal_text":{"description":"If true, the pattern will be treated as literal text with special regex characters escaped. Default is false.","type":"boolean"},"path":{"description":"The directory to search in. Defaults to the current working directory.","type":"string"},"pattern":{"description":"The regex pattern to search for in file contents","type":"string"}},"required":["pattern"],"type":"object"}},"type":"function"},{"function":{"name":"LS","strict":false,"description":"List files and directories as a tree; skips hidden files and common system dirs; max 1000 files. Use glob to find files by pattern, grep to search contents.\n","parameters":{"properties":{"depth":{"description":"The maximum depth to traverse","type":"integer"},"ignore":{"description":"List of glob patterns to ignore","items":{"type":"string"},"type":"array"},"path":{"description":"The path to the directory to list (defaults to current working directory)","type":"string"}},"required":[],"type":"object"}},"type":"function"},{"function":{"name":"Sourcegraph","strict":false,"description":"Search code across public GitHub repositories via Sourcegraph; supports regex, language/repo/file filters, and symbol search (max 20 results). Only searches public repos.\n","parameters":{"properties":{"context_window":{"description":"The context around the match to return (default: 10 lines)","type":"integer"},"count":{"description":"Optional number of results to return (default: 10, max: 20)","type":"integer"},"query":{"description":"The Sourcegraph search query","type":"string"},"timeout":{"description":"Optional timeout in seconds (max 120)","type":"integer"}},"required":["query"],"type":"object"}},"type":"function"},{"function":{"name":"Read","strict":false,"description":"Reads a file from the local filesystem by absolute path, prefixing each line with its number (right-aligned, then `|`).\n\n- The path must be absolute, not relative. It is okay to read a file that does not exist; an error will be returned.\n- Reads up to 200 lines from the start by default; use offset and limit to read later sections. At most 200KB of file content is returned.\n- Renders images (PNG, JPEG, GIF, WebP) visually.\n- Reads files only, not directories — use ls for those.\n- If you read a file that exists but has empty contents you will receive a warning in place of file contents.\n","parameters":{"properties":{"file_path":{"description":"The path to the file to read","type":"string"},"limit":{"description":"The number of lines to read (defaults to 200)","type":"integer"},"offset":{"description":"The line number to start reading from (0-based)","type":"integer"}},"required":["file_path"],"type":"object"}},"type":"function"},{"function":{"name":"Write","strict":false,"description":"Writes a file to the local filesystem, overwriting if one exists; auto-creates parent dirs. Cannot append.\n\n- Read the file first when it already exists, or the call will fail.\n- Prefer Edit or MultiEdit for modifying existing files — they only send the diff. Only use this tool to create new files or for complete rewrites.\n- NEVER create documentation files (*.md) or README files unless explicitly requested by the user.\n- Only use emojis if the user explicitly requests it. Avoid writing emojis to files unless asked.\n","parameters":{"properties":{"content":{"description":"The content to write to the file","type":"string"},"file_path":{"description":"The path to the file to write","type":"string"}},"required":["file_path","content"],"type":"object"}},"type":"function"}],"stream":true}'
