basePath: /v1
definitions:
  catwalk.ModelOptions:
    properties:
      frequency_penalty:
        type: number
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        type: object
      temperature:
        type: number
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  github_com_NaturalSelect_angela_internal_config.ActiveAgentState:
    properties:
      agent:
        type: string
      model:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
      slot:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SlotName'
      think:
        description: |-
          Think is the thinking-mode value the user picked, and is absent
          when they never touched it, for the same reason Variant is: a
          model's catalog default must keep reaching a session that never
          overrode it.
        type: boolean
      variant:
        description: |-
          Variant is the preset the user picked, and is absent when they
          never picked one. The distinction matters: Agent.Variant also
          holds config-derived defaults, and persisting one of those
          would freeze it — changing the default in the config file
          would then never reach this session again. A pointer to the
          empty string is a real pick, namely backing out of a preset.
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_config.Agent:
    properties:
      allowed_mcp:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.AllowedMCPSet'
        description: |-
          AllowedMCP controls which MCP servers and tools are available,
          with the same tri-state semantics as AllowedTools. nil means
          this layer did not mention allowed_mcp.
      allowed_tools:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.AllowedToolSet'
        description: |-
          AllowedTools controls which tools this layer grants. A nil
          value means this layer did not mention allowed_tools (the
          merge keeps whatever a lower-priority layer set); a non-nil
          value is self-describing via its Kind: ToolSetAll grants every
          tool, ToolSetInherited takes the coder's resolved set, and
          ToolSetScope grants only Tools. ResolveAgents' output is always
          non-nil with Kind == ToolSetScope: a fully materialized
          whitelist with every deny list already applied.
      context_paths:
        description: ContextPaths overrides the context paths for this agent.
        items:
          type: string
        type: array
      description:
        type: string
      disabled:
        description: |-
          Disabled uses a pointer so a markdown-layer "disabled: true" can
          be explicitly re-enabled by a higher-priority layer's
          "disabled: false", instead of false being indistinguishable
          from unset.
        type: boolean
      disabled_tools:
        description: DisabledTools removes tools from the resolved whitelist.
        items:
          type: string
        type: array
      hidden:
        description: |-
          Hidden keeps an agent out of the agent tool's dispatch list and
          out of UI completion, while leaving it resolvable by ID. It is a
          pointer for the same reason as Disabled: so a user can un-hide a
          built-in hidden agent with an explicit "hidden: false".

          Hidden is orthogonal to Mode: whether an agent is internal has
          nothing to do with whether it is primary or a subagent.
        type: boolean
      id:
        type: string
      max_tokens:
        description: |-
          MaxTokens caps the agent's output tokens. Zero means the model
          default applies.
        type: integer
      mode:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.AgentMode'
        description: |-
          Mode controls how the agent can be used. Primary agents are
          top-level; subagents are launched via the agent tool; a branch is
          dispatched like a subagent but forks the caller's transcript and
          hands the conversation to the user.
      name:
        type: string
      prompt:
        description: |-
          Prompt is the system prompt text. When set it replaces the
          built-in template for this agent. The text is parsed as a Go
          template with the same data as built-in templates.
        type: string
      slot:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SlotName'
      temperature:
        description: Temperature overrides the model's default sampling temperature.
        type: number
      variant:
        description: |-
          Variant names a parameter preset on the model config above.
          Unknown names degrade to the model's baseline parameters.
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_config.AgentMode:
    enum:
    - primary
    - subagent
    - branch
    type: string
    x-enum-varnames:
    - AgentModePrimary
    - AgentModeSubagent
    - AgentModeBranch
  github_com_NaturalSelect_angela_internal_config.AllowedMCPSet:
    properties:
      kind:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ToolSetKind'
      servers:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
    type: object
  github_com_NaturalSelect_angela_internal_config.AllowedToolSet:
    properties:
      kind:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ToolSetKind'
      tools:
        items:
          type: string
        type: array
    type: object
  github_com_NaturalSelect_angela_internal_config.Attribution:
    properties:
      co_authored_by:
        type: boolean
      generated_with:
        type: boolean
      trailer_style:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.TrailerStyle'
    type: object
  github_com_NaturalSelect_angela_internal_config.CompactionOptions:
    properties:
      auto:
        type: boolean
      large_context_threshold:
        type: integer
      reserved:
        type: integer
      small_context_ratio:
        type: number
    type: object
  github_com_NaturalSelect_angela_internal_config.Completions:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  github_com_NaturalSelect_angela_internal_config.Config:
    properties:
      $schema:
        type: string
      agents:
        additionalProperties:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Agent'
        description: |-
          AgentConfigs holds user-defined agent overrides and custom agents.
          These are merged over built-in defaults during SetupAgents().
        type: object
      env:
        additionalProperties:
          type: string
        description: Env is a map of environment variables set on startup.
        type: object
      hooks:
        additionalProperties:
          items:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.HookConfig'
          type: array
        type: object
      lsp:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.LSPs'
      mcp:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.MCPs'
      options:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Options'
      permissions:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Permissions'
      providers:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_csync.Map-string-github_com_NaturalSelect_angela_internal_config_ProviderConfig'
        description: The providers that are configured
      recent_models:
        additionalProperties:
          items:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
          type: array
        description: |-
          Recently used models. Loaded from and persisted to a sidecar file
          next to the scope's config file (see recent_models.go) rather than
          this struct's own JSON encoding, so auto-recorded picks never
          touch the hand-edited config.
        type: object
      slots:
        additionalProperties:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
        description: |-
          Named model configurations. "main" and "chore" ship as seeds;
          any other name may be defined and referenced by an agent.
        type: object
      tools:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Tools'
    type: object
  github_com_NaturalSelect_angela_internal_config.HookConfig:
    properties:
      command:
        description: Shell command to execute.
        type: string
      matcher:
        description: Regex pattern tested against the tool name. Empty means match
          all.
        type: string
      name:
        description: Friendly display name shown in the TUI. Falls back to Command
          when empty.
        type: string
      timeout:
        description: Timeout in seconds. Default 30.
        type: integer
    type: object
  github_com_NaturalSelect_angela_internal_config.LSPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      env:
        additionalProperties:
          type: string
        type: object
      filetypes:
        items:
          type: string
        type: array
      init_options:
        additionalProperties: {}
        type: object
      options:
        additionalProperties: {}
        type: object
      root_markers:
        items:
          type: string
        type: array
      timeout:
        type: integer
    type: object
  github_com_NaturalSelect_angela_internal_config.LSPs:
    additionalProperties:
      $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.LSPConfig'
    type: object
  github_com_NaturalSelect_angela_internal_config.MCPConfig:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      disabled:
        type: boolean
      disabled_tools:
        items:
          type: string
        type: array
      enabled_tools:
        items:
          type: string
        type: array
      env:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        description: |-
          Headers are HTTP headers for HTTP/SSE MCP servers. Values run
          through shell expansion at MCP startup, so $VAR and $(cmd)
          work. A header whose value resolves to the empty string (unset
          bare $VAR under lenient nounset, $(echo), or literal "") is
          omitted from the outgoing request rather than sent as
          "Header:".
        type: object
      oauth:
        description: |-
          OAuth enables the MCP OAuth 2.1 authorization flow for HTTP
          transport servers. When true, the client uses dynamic client
          registration and opens a browser for the user to authorize.
          Tokens are persisted automatically. Only supported for type=http.
        type: boolean
      oauth_callback_port:
        description: |-
          OAuthCallbackPort pins the localhost port used for the OAuth
          redirect listener. Set this when the OAuth provider requires an
          exact-match callback URL (e.g. GitHub OAuth Apps). When omitted,
          Angela picks the first free port from its default range.
        type: integer
      oauth_client_id:
        description: |-
          OAuthClientID is an optional pre-registered OAuth client ID. Set
          it for servers that do not support dynamic client registration
          (e.g. GitHub, Slack) and instead issue client credentials when you
          register an OAuth app. Values run through shell expansion, so
          $VAR and $(cmd) work.
        type: string
      oauth_client_secret:
        description: |-
          OAuthClientSecret is the optional secret paired with
          OAuthClientID for confidential clients. Values run through shell
          expansion, so $VAR and $(cmd) work.
        type: string
      oauth_token:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_oauth.Token'
        description: |-
          OAuthToken is the persisted OAuth token for this server. It is
          managed internally and stored in the global data config.
      timeout:
        type: integer
      type:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.MCPType'
      url:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_config.MCPType:
    enum:
    - stdio
    - sse
    - http
    type: string
    x-enum-varnames:
    - MCPStdio
    - MCPSSE
    - MCPHttp
  github_com_NaturalSelect_angela_internal_config.MCPs:
    additionalProperties:
      $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.MCPConfig'
    type: object
  github_com_NaturalSelect_angela_internal_config.Options:
    properties:
      agent_paths:
        items:
          type: string
        type: array
      attribution:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Attribution'
      auto_lsp:
        type: boolean
      compaction:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.CompactionOptions'
      context_paths:
        items:
          type: string
        type: array
      data_directory:
        description: |-
          DataDirectory is where Angela keeps per-project state such as
          the SQLite database and workspace overrides. Relative paths are
          resolved against the working directory; absolute paths are used
          verbatim. After defaulting the stored value is always absolute.
        type: string
      debug:
        type: boolean
      debug_lsp:
        type: boolean
      disable_default_providers:
        type: boolean
      disable_metrics:
        type: boolean
      disable_provider_auto_update:
        type: boolean
      disabled_skills:
        items:
          type: string
        type: array
      disabled_tools:
        items:
          type: string
        type: array
      global_context_paths:
        items:
          type: string
        type: array
      initialize_as:
        type: string
      notifications:
        type: string
      progress:
        type: boolean
      reminders:
        items:
          type: string
        type: array
      skills_paths:
        items:
          type: string
        type: array
      subagent_depth:
        type: integer
      tui:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.TUIOptions'
    type: object
  github_com_NaturalSelect_angela_internal_config.Permissions:
    properties:
      allowed_tools:
        items:
          type: string
        type: array
      prompt:
        type: string
      rules:
        items:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_permission.Rule'
        type: array
    type: object
  github_com_NaturalSelect_angela_internal_config.ProviderModel:
    properties:
      can_reason:
        type: boolean
      context_window:
        type: integer
      cost_per_1m_in:
        type: number
      cost_per_1m_in_cached:
        type: number
      cost_per_1m_out:
        type: number
      cost_per_1m_out_cached:
        type: number
      default_max_tokens:
        type: integer
      default_reasoning_effort:
        type: string
      id:
        type: string
      name:
        type: string
      options:
        $ref: '#/definitions/catwalk.ModelOptions'
      reasoning_levels:
        items:
          type: string
        type: array
      supports_attachments:
        type: boolean
      think:
        description: |-
          Think sets the default thinking mode for Anthropic-family
          models that support it. A session can still flip this with
          /think; Think only decides where a fresh session starts.
        type: boolean
      variants:
        additionalProperties:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModelOverride'
        description: |-
          Variants are named parameter presets over this model. They
          override only the keys they name, so N models by M presets
          stays N+M configs instead of N*M. Selecting one is how a
          session overrides this model's defaults for a turn.
        type: object
    type: object
  github_com_NaturalSelect_angela_internal_config.Scope:
    enum:
    - 0
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - ScopeGlobal
    - ScopeWorkspace
    - ScopeEphemeral
  github_com_NaturalSelect_angela_internal_config.SelectedModel:
    properties:
      model:
        description: |-
          The model id as used by the provider API.
          Required.
        type: string
      provider:
        description: |-
          The model provider, same as the key/id used in the providers config.
          Required.
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_config.SelectedModelOverride:
    properties:
      frequency_penalty:
        type: number
      max_tokens:
        type: integer
      presence_penalty:
        type: number
      provider_options:
        additionalProperties: {}
        description: |-
          ProviderOptions merges key by key: the keys a variant names win,
          the baseline's other keys survive.
        type: object
      reasoning_effort:
        type: string
      temperature:
        type: number
      think:
        type: boolean
      top_k:
        type: integer
      top_p:
        type: number
    type: object
  github_com_NaturalSelect_angela_internal_config.SlotName:
    enum:
    - main
    - chore
    type: string
    x-enum-varnames:
    - SlotMain
    - SlotChore
  github_com_NaturalSelect_angela_internal_config.TUIOptions:
    properties:
      compact_mode:
        type: boolean
      completions:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Completions'
      diff_mode:
        type: string
      scrollbar:
        type: string
      transparent:
        type: boolean
    type: object
  github_com_NaturalSelect_angela_internal_config.ToolGlob:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  github_com_NaturalSelect_angela_internal_config.ToolGrep:
    properties:
      timeout:
        $ref: '#/definitions/time.Duration'
    type: object
  github_com_NaturalSelect_angela_internal_config.ToolLs:
    properties:
      max_depth:
        type: integer
      max_items:
        type: integer
    type: object
  github_com_NaturalSelect_angela_internal_config.ToolSetKind:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - ToolSetScope
    - ToolSetAll
    - ToolSetInherited
  github_com_NaturalSelect_angela_internal_config.Tools:
    properties:
      glob:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ToolGlob'
      grep:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ToolGrep'
      ls:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ToolLs'
    type: object
  github_com_NaturalSelect_angela_internal_config.TrailerStyle:
    enum:
    - none
    - co-authored-by
    - assisted-by
    type: string
    x-enum-varnames:
    - TrailerStyleNone
    - TrailerStyleCoAuthoredBy
    - TrailerStyleAssistedBy
  github_com_NaturalSelect_angela_internal_csync.Map-string-github_com_NaturalSelect_angela_internal_config_ProviderConfig:
    type: object
  github_com_NaturalSelect_angela_internal_lsp.ServerState:
    enum:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    type: integer
    x-enum-varnames:
    - StateUnstarted
    - StateStarting
    - StateReady
    - StateError
    - StateStopped
    - StateDisabled
  github_com_NaturalSelect_angela_internal_oauth.OAuthClient:
    properties:
      auth_style:
        type: integer
      auth_url:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      token_url:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_oauth.Token:
    properties:
      access_token:
        type: string
      client:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_oauth.OAuthClient'
      expires_at:
        type: integer
      expires_in:
        type: integer
      refresh_token:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_permission.PatternMode:
    enum:
    - 0
    - 1
    - 2
    - 3
    format: int32
    type: integer
    x-enum-varnames:
    - PatternAuto
    - PatternPath
    - PatternFree
    - PatternDomain
  github_com_NaturalSelect_angela_internal_permission.Rule:
    properties:
      action:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_permission.RuleAction'
        description: Action is what to do when the rule matches.
      mode:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_permission.PatternMode'
        description: Mode selects how Pattern is compared.
      pattern:
        description: Pattern narrows the rule further. Empty or "*" matches everything.
        type: string
      tool:
        description: |-
          Tool narrows the rule. It matches either an access category
          ("read", "edit", "execute", "network", "mcp", "list") or a single
          tool name ("Bash", "View"). Empty matches everything.
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_permission.RuleAction:
    enum:
    - 0
    - 1
    - 2
    format: int32
    type: integer
    x-enum-varnames:
    - RuleDeny
    - RuleAsk
    - RuleAllow
  github_com_NaturalSelect_angela_internal_proto.APIKeyKind:
    enum:
    - string
    - oauth
    type: string
    x-enum-varnames:
    - APIKeyKindString
    - APIKeyKindOAuth
  github_com_NaturalSelect_angela_internal_proto.ActiveAgent:
    properties:
      agent_id:
        type: string
      agent_name:
        type: string
      catwalk_cfg:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ProviderModel'
      model_cfg:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
      slot:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SlotName'
      think:
        type: boolean
      variant:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_proto.ActiveAgentEditRequest:
    properties:
      agent:
        description: |-
          Agent, when non-empty, re-instantiates the session on a
          different primary agent.
        type: string
      model:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
      slot:
        allOf:
        - $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SlotName'
        description: |-
          Model, when non-nil, replaces the session's model outright, and
          Slot labels which global slot it was taken from.
      think:
        description: |-
          Think, when non-nil, sets the thinking flag to an absolute
          value. Callers that mean "flip it" must use ToggleThink: reading
          the flag, flipping it locally and writing the result back races
          another client doing the same, and two flips that should cancel
          out instead both write true.
        type: boolean
      toggle_think:
        description: |-
          ToggleThink flips the thinking flag against the value held under
          the session's lock, so the read and the write cannot be split by
          another edit. It takes precedence over Think.
        type: boolean
      variant:
        description: |-
          Variant, when non-nil, sets the parameter preset. The empty
          string selects the model's baseline, which is how a user backs
          out of a preset.
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_proto.AgentInfo:
    properties:
      is_busy:
        type: boolean
      is_ready:
        type: boolean
      model:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ProviderModel'
      model_cfg:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.SelectedModel'
    type: object
  github_com_NaturalSelect_angela_internal_proto.AgentMessage:
    properties:
      attachments:
        items:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Attachment'
        type: array
      prompt:
        type: string
      run_id:
        type: string
      session_id:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_proto.AgentSession:
    properties:
      active_agent:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.ActiveAgentState'
      agent:
        type: string
      attached_clients:
        type: integer
      completion_tokens:
        type: integer
      cost:
        type: number
      created_at:
        type: integer
      id:
        type: string
      is_branch:
        description: |-
          IsBranch reports whether the serving process still has a parent
          tool call suspended on this session.
        type: boolean
      is_busy:
        type: boolean
      message_count:
        type: integer
      parent_session_id:
        type: string
      prompt_tokens:
        type: integer
      summary_message_id:
        type: string
      title:
        type: string
      todos:
        items:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Todo'
        type: array
      updated_at:
        type: integer
    type: object
  github_com_NaturalSelect_angela_internal_proto.Attachment:
    properties:
      content:
        items:
          type: integer
        type: array
      file_name:
        type: string
      file_path:
        type: string
      mime_type:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_proto.ConfigAgentVariantRequest:
    properties:
      agent_id:
        type: string
      variant:
        type: string
    type: object
  github_com_NaturalSelect_angela_internal_proto.ConfigCompactRequest:
    properties:
      enabled:
        type: boolean
      scope:
        $ref: '#/definitions/github_com_NaturalSelect_angela_internal_config.Scope'
