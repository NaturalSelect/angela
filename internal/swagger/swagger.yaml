info:
  contact:
    name: Charm
    url: https://charm.sh
  description: Angela is a terminal-based AI coding assistant. This API is served
    over a Unix socket (or Windows named pipe) and provides programmatic access to
    workspaces, sessions, agents, LSP, MCP, and more.
  license:
    name: MIT
    url: https://github.com/NaturalSelect/angela/blob/main/LICENSE
  title: Angela API
  version: "1.0"
paths:
  /clients/{client_id}:
    delete:
      parameters:
      - description: Client ID (UUID)
        in: path
        name: client_id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Retire a client
      tags:
      - system
  /config:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get server config
      tags:
      - system
  /control:
    post:
      consumes:
      - application/json
      parameters:
      - description: Control command (e.g. shutdown, shutdown_if_idle)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.ServerControl'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Send server control command
      tags:
      - system
  /health:
    get:
      responses:
        "200":
          description: OK
      summary: Health check
      tags:
      - system
  /version:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.VersionInfo'
      summary: Get server version
      tags:
      - system
  /workspaces:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Workspace'
            type: array
      summary: List workspaces
      tags:
      - workspaces
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace creation params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Workspace'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Workspace'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Create workspace
      tags:
      - workspaces
  /workspaces/{id}:
    delete:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Delete workspace
      tags:
      - workspaces
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Workspace'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Get workspace
      tags:
      - workspaces
  /workspaces/{id}/agent:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.AgentInfo'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Get agent info
      tags:
      - agent
    post:
      consumes:
      - application/json
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Agent message
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.AgentMessage'
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Send message to agent
      tags:
      - agent
  /workspaces/{id}/agent/active-agent:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.ActiveAgent'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Get the default active agent
      tags:
      - agent
  /workspaces/{id}/agent/init:
    post:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Initialize agent
      tags:
      - agent
  /workspaces/{id}/agent/sessions/{sid}:
    get:
      parameters:
      - description: Workspace ID
        in: path
        name: id
        required: true
        type: string
      - description: Session ID
        in: path
        name: sid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.AgentSession'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NaturalSelect_angela_internal_proto.Error'
      summary: Get agent session
